<!DOCTYPE html>

<html lang="es-ES">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Práctica 11 - Envío de formularios</title>
        <alink rel="stylesheet" href="12_html_semantico.css">
    </head>
    
    <body>
        <h1>¿Qué envía un formulario?</h1>
        
        <form action="https://webhook.site/ab78e646-8693-4216-ab97-ea4074bd122e" method="post" enctype="multipart/form-data">
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </p>
            <p>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <fieldset>
                <legend>Lenguajes de programación</legend>
                <label><input type="checkbox" name="lenguajes[]" value="html"> HTML</label>
                <label><input type="checkbox" name="lenguajes[]" value="css"> CSS</label>
                <label><input type="checkbox" name="lenguajes[]" value="javascript"> JavaScript</label>
            </fieldset>

            <fieldset>
                <legend>Modalidad preferida</legend>
                <label><input type="radio" name="modalidad" value="presencial"> Presencial</label>
                <label><input type="radio" name="modalidad" value="online"> En línea</label>
                <label><input type="radio" name="modalidad" value="hibrida"> Híbrida</label>
            </fieldset>

            <p>
                <label for="archivo">Adjuntar un archivo:</label>
                <input type="file" id="archivo" name="archivo">
            </p>
            <!-- multipart/form-data permite enviar el contenido binario de archivos junto con los demás campos. -->

            <p>
                <label for="nivel">Nivel:</label>
                <select id="nivel" name="nivel">
                    <option value="principiante">Principiante</option>
                    <option value="intermedio">Intermedio</option>
                    <option value="avanzado">Avanzado</option>
                </select>
            </p>

            <button type="submit">Enviar</button>
            <button type="reset">Restablecer</button>
        </form>
    </body>

</html>
